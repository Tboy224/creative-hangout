<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #65717b;
      --line: #d8e0e6;
      --field: #f7f9fb;
      --brand: #0f766e;
      --brand-dark: #0b5f59;
      --paper: #ffffff;
      --wash: #eef6f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 38%),
        linear-gradient(315deg, rgba(245, 158, 11, 0.12), transparent 35%),
        #fbfcfd;
      color: var(--ink);
      padding: 24px;
    }

    main {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(23, 32, 38, 0.08);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--wash);
      color: var(--brand-dark);
      font-size: 0.88rem;
      font-weight: 700;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 2rem;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      padding: 11px 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      background: #ffffff;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button:hover {
      background: var(--brand-dark);
    }

    .error {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      background: #fef2f2;
      color: #991b1b;
      font-weight: 700;
      line-height: 1.5;
    }

    .error.visible {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">The Creative Hangout</span>
    <h1>Admin login</h1>
    <p>Sign in to view registrations and payment details.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Login</button>
      <div class="error" id="errorMessage" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.querySelector("#loginForm");
    const errorMessage = document.querySelector("#errorMessage");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorMessage.classList.remove("visible");
      button.disabled = true;
      button.textContent = "Logging in...";

      const formData = new FormData(form);

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: formData.get("username"),
            password: formData.get("password")
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Login failed.");
        }

        window.location.href = "/admin.html";
      } catch (error) {
        errorMessage.textContent = error.message || "Login failed.";
        errorMessage.classList.add("visible");
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>
</body>
</html>
